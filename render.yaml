services:
  - type: web
    name: farmer-decision-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: farmer-decision-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: farmer-decision-db
    databaseName: farmer_decision
    user: farmer_user
    plan: free
    region: oregon
